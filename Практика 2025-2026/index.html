<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
    <div class="form">
        <h1 class="label" style="font-size: 25px;">Калькулятор рисков</h1>
        <div class="firstPart">
            <div class="formInput">
                <label for="" class="label">Число испытаний ( n - целое, >= 0 ):</label>
                <input type="number" name="" id="" class="inputNumberTests input">
                <label for="" class="label">Число успехов ( k - целое, <= n ):</label>
                <input type="number" name="" id="" class="inputNumberSuccess input">
                <label for="" class="label">Вероятность успеха ( p - число от 0 до 1 ):</label>
                <input type="number" name="" id="" class="inputChanceSuccess input">
                <button class="buttonForInputData">
                    Рассчитать
                </button>
            </div>
            <div class="label outputText" style="border: 2px solid black; border-radius: 10px; padding: 10px;">Результат:</div>
        </div>

    </div>
    <script src="main.js"></script>
</body>
</html>
